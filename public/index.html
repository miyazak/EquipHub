<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EquipHub | 備品貸し出しシステム</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-shape bg-shape-a"></div>
    <div class="bg-shape bg-shape-b"></div>

    <main class="layout">
      <header class="hero card">
        <p class="kicker">Internal Demo</p>
        <h1>EquipHub</h1>
        <p class="lead">GitHub Projects で運用しやすい、備品貸し出し管理のデモアプリ</p>

        <div class="stats" id="stats"></div>
      </header>

      <section class="controls card">
        <div class="field">
          <label for="statusFilter">ステータス</label>
          <select id="statusFilter">
            <option value="all">すべて</option>
            <option value="available">貸出可</option>
            <option value="borrowed">貸出中</option>
          </select>
        </div>

        <div class="field field-wide">
          <label for="keyword">キーワード検索</label>
          <input id="keyword" type="text" placeholder="備品名 / カテゴリ / 借りた人" />
        </div>

        <button id="reloadBtn" class="btn">再読み込み</button>
      </section>

      <section class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>備品名</th>
                <th>カテゴリ</th>
                <th>状態</th>
                <th>借用者</th>
                <th>期限</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="itemTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <template id="borrowFormTemplate">
      <form class="borrow-form">
        <input type="text" name="borrower" placeholder="借用者名" required />
        <input type="date" name="dueDate" required />
        <button class="btn btn-small" type="submit">貸出</button>
      </form>
    </template>

    <script src="app.js"></script>
  </body>
</html>
